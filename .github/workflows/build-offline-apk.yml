# Build a self-contained ARM64 test APK: app + MOTIS + offline transit data.
# This workflow runs on the feature branch without merging untested changes.
name: Build offline APK

on:
  push:
    branches:
      - feature/bundled-offline-transit-data
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out fork branch
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android 36 SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Download complete offline transit data for bundling
        run: |
          curl -fL --retry 4 --retry-delay 10 --connect-timeout 30 \
            -o "${RUNNER_TEMP}/movitop-transit.zip" \
            "https://github.com/a-true-man/MovitTop/releases/download/transit-data-latest/movitop-data-latest.zip"
          echo "Downloaded archive size:"
          du -h "${RUNNER_TEMP}/movitop-transit.zip"

      - name: Build debug APK containing the full transit archive
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug \
            -PmovitopDataZip="${RUNNER_TEMP}/movitop-transit.zip"

      - name: Verify APK includes transit ZIP and content SHA
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z -1 "$APK" | grep -Fx 'assets/motis-data.zip'
          unzip -Z -1 "$APK" | grep -Fx 'assets/motis-data.version'
          unzip -p "$APK" assets/motis-data.version | grep -E '^[0-9a-f]{64}$'
          echo "Built APK:"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MovitTop-offline-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Produce AES-256 encrypted ZIP (containing the APK)
        env:
          ZIP_PASSWORD: 'MovitTop-Offline-2026!'
        run: |
          python -m pip install --quiet pyzipper==0.3.6
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import zipfile
          import pyzipper

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          output = Path("MovitTop-offline-AES256.zip")
          password = os.environ["ZIP_PASSWORD"].encode("utf-8")
          original_hash = hashlib.file_digest(apk.open("rb"), "sha256").hexdigest()

          # APKs are ZIP containers already; storing rather than recompressing
          # keeps memory/CPU overhead low on the GitHub runner.
          with pyzipper.AESZipFile(output, "w", compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              archive.setpassword(password)
              archive.setencryption(pyzipper.WZ_AES, nbits=256)
              archive.write(apk, arcname="MovitTop-offline.apk")

          # Independently decrypt the archive and stream-verify every byte,
          # preventing empty/corrupt downloads from being published as valid.
          with pyzipper.AESZipFile(output, "r") as archive:
              archive.setpassword(password)
              assert archive.namelist() == ["MovitTop-offline.apk"]
              digest = hashlib.sha256()
              with archive.open("MovitTop-offline.apk") as payload:
                  while chunk := payload.read(1024 * 1024):
                      digest.update(chunk)
              assert digest.hexdigest() == original_hash, "Decrypted APK checksum mismatch"

          assert output.stat().st_size > 100_000_000, "Unexpectedly small encrypted ZIP"
          print("Encrypted ZIP created and verified:", output.stat().st_size, "bytes")
          print("APK SHA-256:", original_hash)
          PY

      - name: Publish encrypted ZIP as a direct GitHub Release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="movitop-offline-encrypted"
          ZIP="MovitTop-offline-AES256.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" \
              --title "MovitTop Offline — encrypted test APK" \
              --notes "AES-256 encrypted ZIP containing a debug-signed offline APK. Extract using 7-Zip. Password: MovitTop-Offline-2026! Data snapshot: upstream public transit package (2026-09-29)."
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "MovitTop Offline — encrypted test APK" \
              --notes "AES-256 encrypted ZIP containing a debug-signed offline APK. Extract using 7-Zip. Password: MovitTop-Offline-2026! Data snapshot: upstream public transit package (2026-09-29)." \
              --prerelease
          fi
